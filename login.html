<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
    <title>STEM Connect | login</title>
</head>
<body>
    <div class="container">
        <div class="row min-vh-100">
            <div class="col-lg-6">
                <div class="login-box">
                    <div class="logo mb-4">
                        <div class="logo-icon">SC</div>
                        <div>
                            <h2>STEM Connect</h2>
                            <p>Your All-in-one student paltform</p>
                        </div>
                    </div>
                    <div id="loginPanel">
                        <h2>Welcome Back!</h2>
                        <p>Continue your learning journey</p>
                        <div class="mb-3">
                            <label class="form-label"> Email</label>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password">
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember"> Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none"> Forgot password?</a>
                        </div>
                        <button class="btn btn-primary w-100 py-2 mb-3 login-btn" id="loginBtn" type="button"> Login </button>
                        <p class="text-center text-muted"> or </p>
                        <button class="w-100 py-2 mb-3 guest-btn" id="guestBtn" type="button"> Continue as guest </button>
                        <p class="text-center mt-4">
                            Don't have account? 
                            <a href="#" class="text-decoration-none fw-semibold" id="showSignup">Sign up</a>
                        </p>
                    </div>
                    <div id="signupPanel" class="d-none">
                        <h2>Create Account</h2>
                        <p>Join STEM Connect and start your journey</p>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" id="signupName" placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="signupEmail" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="signupPassword" placeholder="Create a password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                        </div>
                        <div class="input-group mb-4">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" class="form-control" id="signupConfirm" placeholder="Re-enter your password">
                        </div>
                        <button class="btn btn-primary w-100 py-2 mb-3 login-btn" id="signupBtn" type="button"> Create Account </button>
                        <p class="text-center mt-4">
                            Already have an account? 
                            <a href="#" class="text-decoration-none fw-semibold" id="showLogin">Login</a>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center">
                <img src="illustration.png" class="img-fluid login-img" alt="Login Illuteration">
            </div>
        </div>
    </div>

    <script>
        const loginPanel = document.getElementById("loginPanel");
        const signupPanel = document.getElementById("signupPanel");
        const showSignup = document.getElementById("showSignup");
        const showLogin = document.getElementById("showLogin");

        showSignup.addEventListener("click", (e) => {
            e.preventDefault();
            loginPanel.classList.add("d-none");
            signupPanel.classList.remove("d-none");
        });

        showLogin.addEventListener("click", (e) => {
            e.preventDefault();
            signupPanel.classList.add("d-none");
            loginPanel.classList.remove("d-none");
        });

        function getUsers() {
            return JSON.parse(localStorage.getItem("users")) || [];
        }

        function saveUsers(users) {
            localStorage.setItem("users", JSON.stringify(users));
        }

        const signupBtn = document.getElementById("signupBtn");

        signupBtn.addEventListener("click", function () {
            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim().toLowerCase();
            const password = document.getElementById("signupPassword").value.trim();
            const confirm = document.getElementById("signupConfirm").value.trim();

            if (name === "" || email === "" || password === "" || confirm === "") {
                alert("Please fill in all fields.");
                return;
            }

            if (password !== confirm) {
                alert("Passwords do not match.");
                return;
            }

            const users = getUsers();
            const exists = users.some(u => u.email === email);

            if (exists) {
                alert("An account with this email already exists. Please login instead.");
                return;
            }

            users.push({ name, email, password });
            saveUsers(users);

            localStorage.setItem("currentUser", JSON.stringify({ name, email }));
            window.location.href = "index.html";
        });

        const loginBtn = document.getElementById("loginBtn");
        const guestBtn = document.getElementById("guestBtn");

        loginBtn.addEventListener("click", function () {
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value.trim();

            if (email === "" || password === "") {
                alert("Please fill in all fields.");
                return;
            }

            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                alert("Invalid email or password. Don't have an account? Sign up first.");
                return;
            }

            localStorage.setItem("currentUser", JSON.stringify({ name: user.name, email: user.email }));
            window.location.href = "index.html";
        });

        guestBtn.addEventListener("click", function () {
            localStorage.setItem("currentUser", JSON.stringify({ name: "Guest", email: "" }));
            window.location.href = "index.html";
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
